<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>말차 맛 예측 고정형 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #020617;
      --border: #1f2937;
      --accent-green: #22c55e;
      --accent-blue: #38bdf8;
      --fg: #f3f4f6;
      --fg-soft: #9ca3af;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { 
      height: 100%; 
      background: var(--bg); 
      color: var(--fg); 
      font-family: 'Pretendard', system-ui, sans-serif;
      overflow: hidden; /* 전체 페이지 스크롤 방지 */
    }

    /* 전체 레이아웃: 좌측(고정폭) + 우측(가변) */
    .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      height: 100vh;
      padding: 16px;
    }

    /* 좌측 입력 패널 */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* 패널 공통 스타일 */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    /* 우측 영역: 상단(차트) + 하단(데이터) */
    .main-content {
      display: grid;
      grid-template-rows: 1fr 1fr; /* 상하 1:1 비율 */
      gap: 16px;
      min-height: 0; /* 자식 요소의 overflow 방지 */
    }

    /* 가로 2개 배치 (차트 로우, 데이터 로우 공통) */
    .row-split {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 좌우 1:1 비율 고정 */
      gap: 16px;
      min-height: 0;
    }

    /* 제목 스타일 */
    .panel-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 텍스트 가독성 조절 */
    label { font-size: 13px; color: var(--fg-soft); margin-bottom: 5px; display: block; }
    input, select { 
      width: 100%; padding: 8px 12px; background: #0f172a; 
      border: 1px solid var(--border); border-radius: 8px; 
      color: white; font-size: 14px; margin-bottom: 12px;
    }

    .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    .m-label { font-size: 11px; color: var(--fg-soft); }
    .m-value { font-size: 20px; font-weight: 700; color: var(--accent-green); }

    /* 차트 컨테이너 */
    .chart-container { flex: 1; position: relative; min-height: 0; }

    /* 테이블 스타일 */
    .table-wrapper { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; background: #0f172a; text-align: left; padding: 8px; color: var(--fg-soft); }
    td { padding: 8px; border-bottom: 1px solid var(--border); }
    td.num { text-align: right; }

    /* 유사 샘플 리스트 */
    .sim-item { 
      display: flex; justify-content: space-between; padding: 10px; 
      background: #0f172a; border-radius: 8px; margin-bottom: 8px; 
      border: 1px solid var(--border); font-size: 13px;
    }

    button { 
      cursor: pointer; padding: 10px; border-radius: 8px; border: none; 
      font-weight: 600; font-size: 14px; transition: 0.2s;
    }
    .btn-primary { background: var(--accent-green); color: #000; width: 100%; margin-top: 5px; }
    .btn-primary:hover { opacity: 0.9; }

    .tag { font-size: 12px; padding: 2px 8px; background: #1e293b; border-radius: 4px; color: var(--accent-blue); }
  </style>
</head>
<body>

<div class="dashboard">
  <!-- 좌측: 입력 패널 -->
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-title">미지 샘플 입력</div>
      <label>글루탐산 (mg/g)</label>
      <input id="glutamate" type="number" step="0.1" value="13">
      <label>테아닌 (mg/g)</label>
      <input id="theanine" type="number" step="0.1" value="18">
      <label>카페인 (mg/g)</label>
      <input id="caffeine" type="number" step="0.1" value="23">
      
      <label>맛 예측 모델</label>
      <select id="model">
        <option value="linear">선형회귀</option>
        <option value="knn">k-NN (k=3)</option>
      </select>
      
      <button class="btn-primary" onclick="runAnalysis()">예측 실행</button>
    </div>

    <div class="panel">
      <div class="panel-title">예측 결과 (1-9점)</div>
      <div class="metric-grid">
        <div class="metric-box"><div class="m-label">감칠맛</div><div class="m-value" id="m-umami">0.0</div></div>
        <div class="metric-box"><div class="m-label">단맛</div><div class="m-value" id="m-sweetness">0.0</div></div>
        <div class="metric-box"><div class="m-label">쓴맛</div><div class="m-value" id="m-bitterness">0.0</div></div>
        <div class="metric-box"><div class="m-label">떫은맛</div><div class="m-value" id="m-astringency">0.0</div></div>
      </div>
    </div>
  </aside>

  <!-- 우측: 차트 + 데이터 -->
  <main class="main-content">
    <!-- 상단: 차트 2개 고정 배치 -->
    <div class="row-split">
      <div class="panel">
        <div class="panel-title">맛 프로파일 (Spider Map)</div>
        <div class="chart-container">
          <canvas id="tasteRadar"></canvas>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">화학지표 비교 (Bar Chart)</div>
        <div class="chart-container">
          <canvas id="chemBar"></canvas>
        </div>
      </div>
    </div>

    <!-- 하단: 데이터 2개 고정 배치 -->
    <div class="row-split">
      <div class="panel">
        <div class="panel-title">유사 샘플 TOP 3 <span id="refTag" class="tag">참조: -</span></div>
        <div id="simList" style="overflow-y: auto;">
          <div class="sim-item">예측을 실행해 주세요.</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">데이터베이스 (CSV)</div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>ID</th><th>산지</th><th>Glu</th><th>Thea</th><th>Caf</th><th>감칠</th><th>단맛</th></tr>
            </thead>
            <tbody id="dbTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  let SAMPLE_DATA = [];
  let tasteChart = null;
  let chemChart = null;

  async function loadData() {
    try {
      const res = await fetch('matcha_database.csv');
      const text = await res.ok ? await res.text() : getFallbackCSV();
      SAMPLE_DATA = parseCSV(text);
      renderTable();
      runAnalysis();
    } catch(e) { console.error(e); }
  }

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    return lines.slice(1).map(line => {
      const values = line.split(',');
      let obj = {};
      headers.forEach((h, i) => obj[h] = isNaN(values[i]) ? values[i] : parseFloat(values[i]));
      return obj;
    });
  }

  function runAnalysis() {
    const g = parseFloat(document.getElementById('glutamate').value);
    const t = parseFloat(document.getElementById('theanine').value);
    const c = parseFloat(document.getElementById('caffeine').value);
    
    // 단순화된 예측 로직
    const pred = {
      umami: Math.min(9, Math.max(1, (g * 0.4 + t * 0.2))),
      sweetness: Math.min(9, Math.max(1, (t * 0.5 - c * 0.05))),
      bitterness: Math.min(9, Math.max(1, (c * 0.3 - t * 0.1))),
      astringency: Math.min(9, Math.max(1, (c * 0.25 - g * 0.05)))
    };

    // UI 업데이트
    document.getElementById('m-umami').innerText = pred.umami.toFixed(1);
    document.getElementById('m-sweetness').innerText = pred.sweetness.toFixed(1);
    document.getElementById('m-bitterness').innerText = pred.bitterness.toFixed(1);
    document.getElementById('m-astringency').innerText = pred.astringency.toFixed(1);

    // 가장 유사한 샘플 찾기 (유클리드 거리)
    let sorted = SAMPLE_DATA.map(s => {
      const dist = Math.sqrt(Math.pow(g-s.glutamate, 2) + Math.pow(t-s.theanine, 2) + Math.pow(c-s.caffeine, 2));
      return { ...s, dist };
    }).sort((a,b) => a.dist - b.dist);

    const ref = sorted[0];
    document.getElementById('refTag').innerText = `참조: ${ref.origin} (${ref.sample_id})`;

    renderSimList(sorted.slice(0,3));
    drawRadar(pred, ref);
    drawBar({glutamate: g, theanine: t, caffeine: c}, ref);
  }

  function renderSimList(list) {
    document.getElementById('simList').innerHTML = list.map((s, i) => `
      <div class="sim-item">
        <span><b>${i+1}. ${s.origin}</b> (${s.sample_id})</span>
        <span style="color:var(--accent-blue)">유사도: ${(100 - s.dist).toFixed(1)}%</span>
      </div>
    `).join('');
  }

  function renderTable() {
    document.getElementById('dbTableBody').innerHTML = SAMPLE_DATA.map(s => `
      <tr>
        <td>${s.sample_id}</td><td>${s.origin}</td>
        <td class="num">${s.glutamate}</td><td class="num">${s.theanine}</td><td class="num">${s.caffeine}</td>
        <td class="num">${s.umami}</td><td class="num">${s.sweetness}</td>
      </tr>
    `).join('');
  }

  function drawRadar(pred, ref) {
    const ctx = document.getElementById('tasteRadar').getContext('2d');
    if(tasteChart) tasteChart.destroy();
    tasteChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['감칠맛', '단맛', '쓴맛', '떫은맛'],
        datasets: [
          { label: '예측', data: [pred.umami, pred.sweetness, pred.bitterness, pred.astringency], borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.2)' },
          { label: '참조', data: [ref.umami, ref.sweetness, ref.bitterness, ref.astringency], borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.2)' }
        ]
      },
      options: { 
        maintainAspectRatio: false,
        scales: { r: { min: 1, max: 9, grid: { color: '#334155' }, pointLabels: { color: '#fff', font: { size: 12 } } } },
        plugins: { legend: { labels: { color: '#fff' } } }
      }
    });
  }

  function drawBar(input, ref) {
    const ctx = document.getElementById('chemBar').getContext('2d');
    if(chemChart) chemChart.destroy();
    chemChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['글루탐산', '테아닌', '카페인'],
        datasets: [
          { label: '입력', data: [input.glutamate, input.theanine, input.caffeine], backgroundColor: '#22c55e' },
          { label: '참조', data: [ref.glutamate, ref.theanine, ref.caffeine], backgroundColor: '#38bdf8' }
        ]
      },
      options: {
        maintainAspectRatio: false,
        scales: { 
          y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#9ca3af' } },
          x: { ticks: { color: '#fff', font: { size: 12 } } }
        },
        plugins: { legend: { labels: { color: '#fff' } } }
      }
    });
  }

  function getFallbackCSV() {
    return "sample_id,origin,glutamate,theanine,caffeine,umami,sweetness,bitterness,astringency\nUJI-01,우지,14.2,19.1,22.8,7.8,7.2,3.9,3.6\nUJI-02,우지,12.5,16.3,20.4,7.3,6.8,4.3,3.8\nNISHIO-01,니시오,10.1,14.5,24.2,6.3,6.2,4.9,4.5";
  }

  window.onload = loadData;
</script>
</body>
</html>
